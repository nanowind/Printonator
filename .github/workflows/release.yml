name: Release

# Phát hành bản mới: build → installer Inno → checksum SHA-256 → minisign ký → tạo GitHub Release.
# Kích hoạt: tự động khi đẩy tag "v*", hoặc thủ công (workflow_dispatch, dùng biến version).
# Auto-update trong app (UpdateChecker) đọc release này: cờ "SHA256: <hex>" trong body + asset .exe.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version để tag (vd 0.1.0) — không cần tiền tố v'
        required: true
        default: '0.1.0'
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            VER="${GITHUB_REF#refs/tags/v}"
          else
            VER="${{ github.event.inputs.version }}"
          fi
          echo "VER=$VER" >> "$GITHUB_OUTPUT"

      - name: Build Release
        run: dotnet build Printonator.sln -c Release

      # Build installer bằng Inno Setup (ISCC). Stage Release binaries + download .NET runtime rồi build.
      - name: Build Inno installer
        shell: powershell
        run: |
          choco install innosetup -y --no-progress
          # Stage fresh Release binaries vào setup\app
          $bin = "src\Printonator.UI\bin\Release\net8.0-windows10.0.19041.0"
          New-Item -ItemType Directory -Force -Path "setup\app" | Out-Null
          Copy-Item "$bin\Printonator.UI.exe","$bin\Printonator.UI.dll","$bin\Printonator.UI.pdb","$bin\Printonator.Core.dll","$bin\Printonator.Core.pdb","$bin\Printonator.Spool.dll","$bin\Printonator.Spool.pdb","$bin\Printonator.UI.runtimeconfig.json","$bin\Printonator.UI.deps.json","$bin\Microsoft.Windows.SDK.NET.dll","$bin\WinRT.Runtime.dll" "setup\app\"
          # Download .NET 8 Desktop Runtime vào setup\runtime (gitignored — không commit 55MB)
          New-Item -ItemType Directory -Force -Path "setup\runtime" | Out-Null
          Invoke-WebRequest -Uri "https://dotnetcli.blob.core.windows.net/dotnet/WindowsDesktop/8.0.30/windowsdesktop-runtime-8.0.30-win-x64.exe" -OutFile "setup\runtime\windowsdesktop-runtime-8.0.30-win-x64.exe"
          # Build với ISCC
          $iscc = (Get-ChildItem "$env:ProgramFiles(x86)\Inno Setup*\ISCC.exe" | Select-Object -First 1).FullName
          & $iscc "setup\printonator.iss" /DMyAppVersion=${{ steps.ver.outputs.VER }}
        env:
          MyAppVersion: ${{ steps.ver.outputs.VER }}

      - name: Compute SHA-256
        id: sha
        shell: bash
        run: |
          HASH=$(sha256sum setup/printonator-setup.exe | cut -d' ' -f1)
          echo "HASH=$HASH" >> "$GITHUB_OUTPUT"

      # Minisign ký installer (public key nhúng trong app). Khi GitHub secret MINISIGN_SECRET_KEY
      # được đặt (nội dung file secret.key, dạng một dòng base64) + MINISIGN_PASSPHRASE, bước này
      # ký thật → tạo setup.exe.minisig. Chưa đặt secret → bỏ qua (release vẫn có SHA-256).
      - name: Minisign sign installer
        if: ${{ secrets.MINISIGN_SECRET_KEY != '' }}
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSPHRASE: ${{ secrets.MINISIGN_PASSPHRASE }}
        shell: bash
        run: |
          # Cài minisign (tạm) và ký
          if command -v minisign >/dev/null 2>&1; then :; else
            curl -sL -o /tmp/minisign.zip https://github.com/jedisct1/minisign/releases/download/0.11/minisign-0.11-win64.zip
            (cd /tmp && unzip -o minisign.zip)
          fi
          MSIG=$(command -v minisign || echo /tmp/x86_64/minisign.exe)
          printf '%s\n' "$MINISIGN_PASSPHRASE" > /tmp/ms-pass
          "$MSIG" -S -s <(printf '%s' "$MINISIGN_SECRET_KEY") \
                 -t /tmp/ms-pass -m setup/printonator-setup.exe
          ls -la setup/printonator-setup.exe.minisig

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.VER }}
          name: Printonator v${{ steps.ver.outputs.VER }}
          body: |
            ## Printonator v${{ steps.ver.outputs.VER }}

            SHA256: ${{ steps.sha.outputs.HASH }}

            - In hàng loạt (PDF/DOCX/XLSX/PPTX/ảnh/TXT)
            - AI in giùm qua MCP + guardrail an toàn
            - 100% local, MIT
          draft: true
          files: |
            setup/printonator-setup.exe
            setup/printonator-setup.exe.minisig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
name: Release

# Phát hành bản mới: build → installer Inno → checksum SHA-256 → minisign ký → tạo GitHub Release.
# Kích hoạt: tự động khi đẩy tag "v*", hoặc thủ công (workflow_dispatch, dùng biến version).
# Auto-update trong app (UpdateChecker) đọc release này: cờ "SHA256: <hex>" trong body + asset .exe.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version để tag (vd 0.1.0) — không cần tiền tố v'
        required: true
        default: '0.1.0'
  push:
    tags:
      - 'v*'

# GITHUB_TOKEN mặc định KHÔNG có quyền tạo GitHub Release → softprops fail "Resource not
# accessible by integration". Khai báo contents: write để action-gh-release tạo draft release.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Mặc định fetch-depth=1 → không fetch tag/history → changelog range sai ("release đầu").
          # fetch-depth=0: đủ lịch sử + tag để git log PREV_TAG..HEAD sinh changelog đúng.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            VER="${GITHUB_REF#refs/tags/v}"
          else
            VER="${{ github.event.inputs.version }}"
          fi
          echo "VER=$VER" >> "$GITHUB_OUTPUT"

      - name: Build Release
        run: dotnet build Printonator.sln -c Release

      # GATE TRƯỚC KHI RELEASE: Core + Spool E2E phải XANH — lỗi là không publish được.
      # (UI FlaUI có 2 test flaky pre-existing → không gate để không chặn release; ci.yml chạy đủ.)
      - name: Run Core + Spool tests (gate)
        run: |
          dotnet test tests/Printonator.Core.Tests/Printonator.Core.Tests.csproj -c Release --no-build
          dotnet test tests/Printonator.Spool.Tests/Printonator.Spool.Tests.csproj -c Release --no-build

      # Build installer bằng Inno Setup (ISCC). Stage Release binaries + download .NET runtime
      # (chỉ để VERIFY SHA đồng bộ với hằng số trong printonator.iss — runtime KHÔNG gói vào installer,
      # download on-demand lúc cài khi máy thiếu .NET).
      - name: Build Inno installer
        shell: powershell
        run: |
          choco install innosetup -y --no-progress
          # Stage fresh Release binaries vào setup\app
          $bin = "src\Printonator.UI\bin\Release\net8.0-windows10.0.19041.0"
          New-Item -ItemType Directory -Force -Path "setup\app" | Out-Null
          Copy-Item "$bin\Printonator.UI.exe","$bin\Printonator.UI.dll","$bin\Printonator.UI.pdb","$bin\Printonator.Core.dll","$bin\Printonator.Core.pdb","$bin\Printonator.Spool.dll","$bin\Printonator.Spool.pdb","$bin\Printonator.UI.runtimeconfig.json","$bin\Printonator.UI.deps.json","$bin\Microsoft.Windows.SDK.NET.dll","$bin\WinRT.Runtime.dll","$bin\System.Drawing.Common.dll" "setup\app\"
          # Download .NET 8 Desktop Runtime (gitignored — chỉ để verify SHA ở bước kế)
          New-Item -ItemType Directory -Force -Path "setup\runtime" | Out-Null
          Invoke-WebRequest -Uri "https://dotnetcli.blob.core.windows.net/dotnet/WindowsDesktop/8.0.30/windowsdesktop-runtime-8.0.30-win-x64.exe" -OutFile "setup\runtime\windowsdesktop-runtime-8.0.30-win-x64.exe"
          # Build với ISCC. LƯU Ý: dùng ${env:ProgramFiles(x86)} (cú pháp đúng) — $env:ProgramFiles(x86)
          # bị parse thành $env:ProgramFiles + "(x86)" → path "C:\Program Files(x86)" KHÔNG tồn tại → fail.
          # Ưu tiên choco shim trên PATH, fallback Program Files (x86) / Program Files.
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = (Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName }
          if (-not $iscc) { $iscc = (Get-ChildItem "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName }
          if (-not $iscc) { throw "Không tìm thấy ISCC.exe (Inno Setup)" }
          & $iscc "setup\printonator.iss" /DMyAppVersion=${{ steps.ver.outputs.VER }}
        env:
          MyAppVersion: ${{ steps.ver.outputs.VER }}

      # Đồng bộ hằng số DotNetRuntimeSha256 trong printonator.iss với file thật trên CDN dot.net.
      # Nếu CDN đổi file → FAIL build (để lệch thì mọi lần cài máy thiếu .NET đều abort ở bước verify SHA).
      - name: Verify .NET runtime SHA-256 matches printonator.iss
        shell: bash
        run: |
          HASH=$(sha256sum setup/runtime/windowsdesktop-runtime-8.0.30-win-x64.exe | cut -d' ' -f1)
          EXPECTED="8bd710afa5de396c9eb2a3b68d00279b7b9aca372a2443e9acd4f48ffdef3f2d"
          if [ "$HASH" != "$EXPECTED" ]; then
            echo "Runtime SHA mismatch: $HASH (expected $EXPECTED) — cập nhật DotNetRuntimeSha256 trong printonator.iss"
            exit 1
          fi
          echo "Runtime SHA OK: $HASH"

      - name: Compute SHA-256
        id: sha
        shell: bash
        run: |
          HASH=$(sha256sum setup/printonator-setup.exe | cut -d' ' -f1)
          echo "HASH=$HASH" >> "$GITHUB_OUTPUT"

      # Changelog VIẾT TAY (release_notes.template.md) — nói cho NGƯỜI DÙNG, không dump git log.
      # Quy tắc viết + file template xem AGENTS.md mục "Release notes". CI chỉ điền {VER} + {HASH}.
      - name: Build release notes
        id: notes
        shell: bash
        run: |
          VER="${{ steps.ver.outputs.VER }}"
          HASH="${{ steps.sha.outputs.HASH }}"
          TPL=".github/release_notes.template.md"
          if [ ! -f "$TPL" ]; then
            echo "::error::Thiếu $TPL — viết changelog cho NGƯỜI DÙNG (xem AGENTS.md 'Release notes')"
            exit 1
          fi
          sed -e "s/{VER}/$VER/g" -e "s/{HASH}/$HASH/g" "$TPL" > release_body.md
          echo "Release notes lấy từ $TPL (đã điền version + SHA256)"

      # Minisign ký installer (public key nhúng trong app). Khi GitHub secret MINISIGN_SECRET_KEY
      # được đặt (nội dung file secret.key, dạng một dòng base64) + MINISIGN_PASSPHRASE → ký thật
      # tạo setup.exe.minisig. CHƯA đặt secret → bỏ qua im lặng (release vẫn có SHA-256).
      # LƯU Ý: github không cho dùng `secrets` trong `if:` step — nên bước này luôn chạy và tự skip khi bỏ trống.
      - name: Minisign sign installer
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSPHRASE: ${{ secrets.MINISIGN_PASSPHRASE }}
        shell: bash
        run: |
          # Nếu chưa cấu hình secret → không ký, thoát sạch (không làm fail build)
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "MINISIGN_SECRET_KEY chưa đặt — bỏ qua ký (release chỉ có SHA-256)."
            exit 0
          fi
          # Cài minisign (tạm) và ký — DÙNG BẢN 0.12 (phải khớp phiên bản đã tạo secret key:
          # key bắt đầu 'RWRTY0I' là format MỚI, minisign 0.11 KHÔNG đọc được → 'Error while loading the secret key file').
          if command -v minisign >/dev/null 2>&1; then :; else
            curl -sL -o /tmp/minisign.zip https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-win64.zip
            (cd /tmp && unzip -o minisign.zip)
          fi
          MSIG=$(command -v minisign || echo /tmp/minisign-win64/x86_64/minisign.exe)
          # LƯU Ý: không dùng process substitution <(...) cho Windows exe (không đọc được /dev/fd/*).
          # File secret key minisign cần ĐỦ 2 dòng: "untrusted comment: ..." + dòng base64.
          # GitHub secret chỉ chứa DÒNG BASE64 (dòng 2 của secret.key) — CI tự dựng lại header.
          { printf 'untrusted comment: minisign encrypted secret key\n'; printf '%s\n' "$MINISIGN_SECRET_KEY"; } > /tmp/ms-secret.key
          # Pass truyền qua STDIN pipe (minisign hỏi "Password:" trên stdin — không có TTY trong CI).
          # KHÔNG dùng `-t` (đó là trusted comment, không phải pass file) và không dùng env MINISIGN_PASSWORD.
          printf '%s\n' "$MINISIGN_PASSPHRASE" | "$MSIG" -S -s /tmp/ms-secret.key \
                 -m setup/printonator-setup.exe
          ls -la setup/printonator-setup.exe.minisig
          rm -f /tmp/ms-secret.key

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.VER }}
          name: Printonator v${{ steps.ver.outputs.VER }}
          body_path: release_body.md
          draft: true
          # Glob `*.exe*` → khớp installer + .minisig NẾU có (khi chưa đặt secret minisign thì file .minisig
          # không tồn tại — tham chiếu literal path sẽ làm step fail).
          files: setup/printonator-setup.exe*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}